<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schappie">
<title>Schappie</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F4; --card: #FFFFFF; --line: #E4E7E1; --line-soft: #EEF0EC; --input: #D5D9D2;
    --text: #1C211D; --text-2: #3D433E; --muted: #5B6159;
    --green: #2F6B3F; --green-dark: #1F4A2B; --green-soft: #E3F1E6;
    --warn-bg: #FCEBDD; --warn: #9A4308; --op-bg: #FBE4E4; --op: #9B1C1C;
    --seg: #E9ECE6; --chip: #EEF1EC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 110px); display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .pad { padding: 16px; }
  .seg { background: var(--seg); border-radius: 12px; padding: 4px; display: flex; gap: 4px; }
  .seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500; padding: 0 6px; }
  .seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--text); font-weight: 600; }
  .seg .count { color: var(--muted); font-weight: 400; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--chip); color: var(--text-2); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.op { background: var(--op-bg); color: var(--op); }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 12px; }
  .item + .item { border-top: 1px solid var(--line-soft); }
  .thumb { width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; border: 1px solid var(--line-soft); object-fit: contain; flex-shrink: 0; }
  .thumb.ph { display: flex; align-items: center; justify-content: center; background: var(--chip); color: var(--muted); font-size: 16px; font-weight: 600; border: 0; }
  .item-main { flex: 1; min-width: 0; min-height: 48px; text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .item-name { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step { display: flex; align-items: center; gap: 2px; }
  .step button, .sq { width: 40px; height: 44px; border: 1px solid var(--input); border-radius: 10px; background: #FFFFFF; font-size: 18px; }
  .step .amt { min-width: 74px; text-align: center; font-size: 13px; font-weight: 600; }
  .lvl { display: flex; gap: 4px; }
  .lvl button { min-width: 46px; height: 44px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--input); background: #FFFFFF; font-size: 13px; font-weight: 500; }
  .lvl.big button { flex: 1; height: 52px; }
  .lvl button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #FFFFFF; font-weight: 600; }
  .btn { height: 52px; border: 0; border-radius: 12px; background: var(--green); color: #FFFFFF; font-size: 15px; font-weight: 600; width: 100%; }
  .btn:disabled { opacity: 0.6; }
  .btn.ghost { background: #FFFFFF; color: var(--text); border: 1px solid var(--input); }
  .btn.danger { background: #FFFFFF; color: var(--op); border: 1px solid #E8C4C4; font-weight: 500; }
  .link { align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font-size: 15px; font-weight: 500; color: var(--green); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field > label, .label { font-size: 14px; font-weight: 600; color: var(--text-2); }
  .input { height: 48px; border: 1px solid var(--input); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; width: 100%; min-width: 0; }
  .input:focus, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .note { margin: 0; font-size: 13px; color: var(--green-dark); background: var(--green-soft); border-radius: 10px; padding: 10px 12px; }
  .error { margin: 0; font-size: 13px; color: var(--op); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
  .check input { width: 22px; height: 22px; accent-color: var(--green); }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--input); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ns { font-size: 11px; font-weight: 700; color: #FFFFFF; border-radius: 6px; padding: 2px 6px; line-height: 1.3; }
  .ns-a { background: #1B7A43; } .ns-b { background: #4E8A12; } .ns-c { background: #8A6D00; } .ns-d { background: #B3530B; } .ns-e { background: #B4231B; }
  .nut { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 14px; }
  .nut .sub { padding-left: 12px; color: var(--muted); }
  .info details summary { cursor: pointer; font-size: 14px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .fab-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 20px); width: calc(100% - 40px); max-width: 520px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
  .fab-bar .btn { box-shadow: 0 0 0 4px var(--bg); }
  #reader { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #1C211D; }
  #reader video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #reader .frame { position: absolute; left: 8%; right: 8%; top: 30%; bottom: 30%; border: 2px solid #FFFFFF; border-radius: 12px; }
  #reader .line { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; background: #6FCF86; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 20px); width: calc(100% - 40px); max-width: 520px; box-shadow: 0 0 0 4px var(--bg); }
  .toast[hidden] { display: none !important; }
  .toast button { background: none; border: 0; color: #9FE1B0; font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 4px; white-space: nowrap; }
  details.adv > summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--green); min-height: 44px; display: flex; align-items: center; }
  .recent { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .toast { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 86px); width: calc(100% - 40px); max-width: 520px; background: var(--text); color: #FFFFFF; border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 500; z-index: 10; }
  .center { min-height: 100vh; justify-content: center; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .small-btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--input); background: #FFFFFF; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .small-btn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #FFFFFF; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
// Toon fouten op het scherm in plaats van een lege pagina
function showFatal(msg) {
  var app = document.getElementById('app');
  if (app) app.innerHTML = '<main class="wrap center"><h1>Er ging iets mis</h1><p class="error" style="font-size:15px">' + String(msg).replace(/[<>&]/g, '') + '</p><p class="muted">Stuur een screenshot van dit scherm naar Claude.</p></main>';
}
window.addEventListener('error', function (e) { if (String(e.message).indexOf('supabase-js niet geladen') < 0) showFatal(e.message || 'Onbekende fout'); });
window.addEventListener('unhandledrejection', function (e) { showFatal((e.reason && e.reason.message) || e.reason || 'Onbekende fout'); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');
</script>
<script>
if (!window.supabase) { showFatal('De verbinding met Supabase kon niet worden geladen. Controleer je internet of probeer een andere browser.'); throw new Error('supabase-js niet geladen'); }
// ===== INSTELLINGEN: vul deze twee in (Supabase → Project Settings → API Keys) =====
const SUPABASE_URL = 'https://rvucshogutdqwjfngarc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g6dwmq_7hs8li_S_ICSwXQ_Qe400crT';
// ==================================================================================

const APP_VERSION = '8';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PLACES = [['koelkast', 'Koelkast'], ['vriezer', 'Vriezer'], ['kast', 'Kast']];
const TRACKS = [['aantal', 'Aantal'], ['gram', 'Gram'], ['niveau', 'Vol/half/leeg']];
const LEVELS = ['Vol', 'Half', 'Leeg'];
const FRAC = { Vol: 1, Half: 0.5, Leeg: 0 };

const state = {
  screen: 'loading',   // loading | login | voorraad | form | scan | confirm
  memory: {},
  batch: (() => { try { return localStorage.getItem('schappie-batch') === '1'; } catch (e) { return false; } })(),
  recent: [],
  returnToScan: false,
  showOpenDate: false,
  advOpen: false,
  nevoOpen: false,
  info: '',
  handling: false,
  user: null,
  products: [],
  tab: 'koelkast',
  edit: null,          // product dat bewerkt wordt (kopie)
  editOriginalPlace: null,
  note: '',
  error: '',
  confirmDelete: false,
  busy: false
};

// ---------- hulpfuncties ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return iso(d); };
const daysUntil = (s) => Math.round((parseDate(s) - parseDate(today())) / 86400000);
const single = (u) => ({ stuks: 'stuk', plakken: 'plak', sneetjes: 'sneetje', blikken: 'blik', blikjes: 'blikje', pakken: 'pak', potten: 'pot', zakken: 'zak', bakjes: 'bakje', flessen: 'fles' }[u] || u);

function effExpiry(p) {
  let e = p.expires_on || null;
  if (p.opened_on && p.open_shelf_days) {
    const o = addDays(p.opened_on, p.open_shelf_days);
    if (!e || o < e) e = o;
  }
  return e;
}
function expText(s) {
  if (!s) return 'Geen datum';
  const d = daysUntil(s);
  if (d < 0) return 'Over de datum';
  if (d === 0) return 'Vandaag';
  if (d === 1) return 'Morgen';
  if (d <= 45) return `Nog ${d} dagen`;
  return `Nog ${Math.round(d / 30)} mnd`;
}
function stockG(p) {
  if (p.track === 'gram') return p.grams;
  if (p.track === 'aantal') return p.count * p.grams_per_unit;
  return p.full_grams * FRAC[p.level];
}
function fmtG(g) { return g >= 1000 ? `${String(Math.round(g / 100) / 10).replace('.', ',')} kg` : `${Math.round(g)} g`; }
function amountText(p) {
  if (p.track === 'gram') return fmtG(p.grams);
  if (p.track === 'aantal') return `${p.count} ${p.count === 1 ? single(p.unit) : p.unit}`;
  return p.level;
}
function chip(p) {
  if (stockG(p) <= 0) return { text: 'Op', cls: 'op' };
  const e = effExpiry(p);
  if (!e) return { text: 'Geen datum', cls: '' };
  return { text: expText(e), cls: daysUntil(e) <= 3 ? 'warn' : '' };
}
function convert(p, mode) {
  const g = stockG(p);
  return {
    ...p, track: mode,
    count: Math.round(g / p.grams_per_unit),
    grams: Math.round(g / 10) * 10,
    level: g >= p.full_grams * 0.66 ? 'Vol' : g > 0 ? 'Half' : 'Leeg'
  };
}
function movePlace(p, place) {
  if (place === p.place) return { p, note: '' };
  const n = { ...p, place };
  let note = 'Houdbaarheid blijft gelijk.';
  if (place === 'vriezer') {
    if (p.freezable) {
      const frozen = addDays(today(), 90);
      if (!n.expires_on || n.expires_on < frozen) n.expires_on = frozen;
      n.opened_on = null;
      note = 'Ingevroren: de datum staat nu op ongeveer 3 maanden. Pas hem gerust aan.';
    } else {
      note = 'Dit product kun je beter niet invriezen. De datum blijft gelijk.';
    }
  } else if (p.place === 'vriezer') {
    const thawed = addDays(today(), 2);
    if (!n.expires_on || n.expires_on > thawed) n.expires_on = thawed;
    note = 'Ontdooid: gebruik het binnen 2 dagen.';
  }
  return { p: n, note };
}

let toastTimer;
let toastFn = null;
function toast(msg, actionLabel, actionFn) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button" id="toast-action">${esc(actionLabel)}</button>` : ''}`;
  toastFn = actionFn || null;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastFn = null; }, actionLabel ? 5000 : 2600);
}
document.getElementById('toast').addEventListener('click', (e) => {
  if (e.target.id === 'toast-action' && toastFn) { const fn = toastFn; toastFn = null; document.getElementById('toast').hidden = true; fn(); }
});

// ---------- data ----------
async function loadProducts() {
  const { data, error } = await db.from('products').select('*').order('name');
  if (error) { toast('Laden mislukt: ' + error.message); return; }
  state.products = data;
  if (state.screen === 'voorraad') render();
  setTimeout(backfillImages, 1500);
  try {
    const mem = await db.from('product_memory').select('barcode, data');
    if (!mem.error && mem.data) state.memory = { ...state.memory, ...Object.fromEntries(mem.data.map((m) => [m.barcode, m.data])) };
  } catch (e) { /* geheugen is optioneel */ }
}
let backfillDone = false;
async function backfillImages() {
  if (backfillDone) return;
  backfillDone = true;
  const todo = state.products.filter((p) => p.barcode && !p.image_url).slice(0, 15);
  for (const p of todo) {
    const ah = await ahLookup({ gtin: p.barcode });
    let img = ah && /^https:\/\//.test(ah.image || '') ? ah.image : null;
    if (!img) {
      try { const off = await lookupOpenFoodFacts(p.barcode); if (off && /^https:\/\//.test(off.image_front_small_url || '')) img = off.image_front_small_url; } catch (e) { /* volgende */ }
    }
    if (img) await patchProduct(p.id, { image_url: img }, true);
  }
}
async function patchProduct(id, changes, quiet) {
  const before = state.products.find((p) => p.id === id);
  state.products = state.products.map((p) => (p.id === id ? { ...p, ...changes } : p));
  if (!quiet || state.screen === 'voorraad') render();
  const { error } = await db.from('products').update(changes).eq('id', id);
  if (error) {
    toast('Opslaan mislukt, probeer het opnieuw');
    state.products = state.products.map((p) => (p.id === id ? before : p));
    render();
  }
}

// ---------- schermen ----------
const back = (label) => `<button class="link" data-action="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>${esc(label)}</button>`;

function viewLogin() {
  return `<main class="wrap center">
    <div><h1>Schappie</h1><p class="muted">Log in om je koelkast, vriezer en kast te zien.</p></div>
    <form class="card pad" data-form="login" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <div class="field"><label for="email">E-mailadres</label><input class="input" id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">Wachtwoord</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
      <button class="btn" type="submit" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Bezig…' : 'Inloggen'}</button>
    </form>
  </main>`;
}

function viewVoorraad() {
  const urgent = state.products
    .filter((p) => stockG(p) > 0 && effExpiry(p) && daysUntil(effExpiry(p)) <= 3)
    .sort((a, b) => (effExpiry(a) < effExpiry(b) ? -1 : 1));
  const list = state.products.filter((p) => p.place === state.tab);

  const urgentHtml = urgent.length ? `<section class="card pad" style="display:flex;flex-direction:column;gap:8px">
      <div class="row" style="color:var(--warn)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><h2 style="color:var(--text)">Gaat bijna over de datum</h2></div>
      ${urgent.map((p) => `<div class="between" style="min-height:30px"><span style="font-size:15px">${esc(p.name)}</span><span class="chip warn">${esc(expText(effExpiry(p)))}</span></div>`).join('')}
    </section>` : '';

  const tabs = PLACES.map(([id, label]) => `<button data-action="tab" data-value="${id}" aria-pressed="${state.tab === id}">${label} <span class="count">${state.products.filter((p) => p.place === id).length}</span></button>`).join('');

  const rows = list.map((p) => {
    const c = chip(p);
    const control = p.track === 'niveau'
      ? `<div class="lvl">${LEVELS.map((L) => `<button data-action="level" data-id="${p.id}" data-value="${L}" aria-pressed="${p.level === L}">${L}</button>`).join('')}</div>`
      : `<div class="step"><button data-action="dec" data-id="${p.id}" aria-label="Minder ${esc(p.name)}">−</button><span class="amt">${esc(amountText(p))}</span><button data-action="inc" data-id="${p.id}" aria-label="Meer ${esc(p.name)}">+</button></div>`;
    const thumb = p.image_url
      ? `<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy" width="44" height="44">`
      : `<span class="thumb ph" aria-hidden="true">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>`;
    return `<div class="item">
      ${thumb}
      <button class="item-main" data-action="open" data-id="${p.id}">
        <span class="item-name">${esc(p.name)}</span>
        <span class="row" style="gap:6px"><span class="chip ${c.cls}">${esc(c.text)}</span>${p.nutriscore ? `<span class="ns ns-${p.nutriscore}" aria-label="Nutri-Score ${p.nutriscore.toUpperCase()}">${p.nutriscore.toUpperCase()}</span>` : ''}${p.opened_on ? '<span class="muted" style="font-size:12px">Geopend</span>' : ''}</span>
      </button>${control}</div>`;
  }).join('');

  return `<main class="wrap">
    <div class="between"><h1>Voorraad</h1>
      <div class="row">
        <button class="icon-btn" data-action="refresh" aria-label="Vernieuwen" title="Vernieuwen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="small-btn" data-action="logout">Uitloggen</button>
      </div></div>
    ${urgentHtml}
    <div class="seg" role="group" aria-label="Plek">${tabs}</div>
    <section class="card">${rows || `<p class="empty">Nog niets in je ${PLACES.find((x) => x[0] === state.tab)[1].toLowerCase()}. Voeg je eerste product toe.</p>`}</section>
    ${list.length ? '<p class="muted" style="text-align:center;font-size:12px">Tik op een product voor alle opties</p>' : ''}
    <p class="muted" style="text-align:center;font-size:11px">Schappie versie ${APP_VERSION} · <button class="link" style="display:inline;min-height:0;font-size:11px" data-action="about">Over Schappie en bronnen</button></p>
  </main>
  <div class="fab-bar"><button class="btn ghost" data-action="new">+ Handmatig</button><button class="btn" data-action="scan">Barcode scannen</button></div>`;
}

function viewForm() {
  const p = state.edit;
  const isNew = !p.id;

function offToInfo(prod) {

// ---------- Albert Heijn (onofficieel, via serverfunctie 'ah') ----------
async function ahLookup(body) {
  try {
    const call = db.functions.invoke('ah', { body });
    const timeout = new Promise((resolve) => setTimeout(() => resolve({ data: null, error: 'timeout' }), 7000));
    const { data, error } = await Promise.race([call, timeout]);
    if (error || !data) return null;
    return data.result || null;
  } catch (e) { return null; }
}
const euro = (n) => '€ ' + Number(n).toFixed(2).replace('.', ',');

// ---------- Checkjebon (prijzen van supermarkten, open data) ----------
const CJB_URL = 'https://raw.githubusercontent.com/supermarkt/checkjebon/main/data/supermarkets.json';
const STORES = { ah: 'Albert Heijn', jumbo: 'Jumbo', lidl: 'Lidl', plus: 'Plus', dirk: 'Dirk', aldi: 'Aldi', vomar: 'Vomar', hoogvliet: 'Hoogvliet', dekamarkt: 'DekaMarkt', spar: 'Spar', poiesz: 'Poiesz', ekoplaza: 'Ekoplaza', coop: 'Coop', jan: 'Jan Linders', janlinders: 'Jan Linders', nettorama: 'Nettorama', picnic: 'Picnic' };
const storeName = (c) => STORES[c] || (c.charAt(0).toUpperCase() + c.slice(1));
let CJB = null, cjbPromise = null, cjbDate = null;
function loadPrices() {
  if (!cjbPromise) {
    cjbPromise = (async () => {
      let res = null;
      try {
        const cache = await caches.open('schappie-prijzen');
        const hit = await cache.match(CJB_URL);
        const age = hit ? Date.now() - Number(hit.headers.get('x-opgehaald') || 0) : Infinity;
        if (hit && age < 24 * 3600 * 1000) res = hit;
        else {
          const fresh = await fetch(CJB_URL);
          if (fresh.ok) {
            const body = await fresh.clone().blob();
            await cache.put(CJB_URL, new Response(body, { headers: { 'x-opgehaald': String(Date.now()), 'content-type': 'application/json' } }));
            res = fresh;
          } else res = hit;
        }
      } catch (e) { res = await fetch(CJB_URL); }
      if (!res) throw new Error('prijzen niet beschikbaar');
      const data = await res.json();
      cjbDate = res.headers.get('x-opgehaald') ? new Date(Number(res.headers.get('x-opgehaald'))) : new Date();
      CJB = [];
      for (const store of data) for (const it of (store.d || [])) {
        if (typeof it.p !== 'number' || !it.n) continue;
        CJB.push({ store: store.n, naam: it.n, n: it.n.toLowerCase(), p: it.p, s: it.s || '', l: it.l || '' });
      }
      return CJB;
    })();
    cjbPromise.catch(() => { cjbPromise = null; });
  }
  return cjbPromise;
}
function sizeInBase(s) {
  const m = String(s || '').toLowerCase().replace(',', '.').match(/(\d+(?:\.\d+)?)\s*(kg|g|gram|ml|cl|l|liter)\b/);
  if (!m) return null;
  return Number(m[1]) * ({ kg: 1000, l: 1000, liter: 1000, cl: 10 }[m[2]] || 1);
}
// Zoekt per supermarkt het best passende (en dan goedkoopste) product
function findPrices(name, sizeHint) {
  if (!CJB) return [];
  const words = norm(name).split(/\s+/).filter((w) => w.length >= 3 && !['jumbo', 'lidl', 'plus', 'aldi', 'dirk', 'biologisch'].includes(w));
  if (!words.length) return [];
  const best = {};
  for (const it of CJB) {
    let hits = 0;
    for (const w of words) if (wordVariants(w).some((x) => it.n.includes(x))) hits++;
    if (hits < Math.max(1, Math.ceil(words.length * 0.75))) continue;
    let score = hits * 3 - it.n.split(' ').length * 0.2;
    const sz = sizeInBase(it.s);
    if (sizeHint && sz) { const ratio = sz / sizeHint; if (ratio > 0.7 && ratio < 1.4) score += 3; else score -= 2; }
    (best[it.store] = best[it.store] || []).push({ it, score });
  }
  // per supermarkt: de goedkoopste van de best passende producten
  const list = Object.values(best).map((arr) => {
    const top = Math.max(...arr.map((x) => x.score));
    return arr.filter((x) => x.score >= top - 1).sort((a, b) => a.it.p - b.it.p)[0];
  });
  if (!list.length) return [];
  const top = Math.max(...list.map((x) => x.score));
  return list.filter((x) => x.score >= top - 2).map((x) => x.it).sort((a, b) => a.p - b.p);
}
async function fillPrices(p) {
  const box = document.getElementById('prices');
  if (!box || !p || !p.name) return;
  const parts = [];
  if (p.barcode) {
    const ah = await ahLookup({ gtin: p.barcode });
    if (ah && /^https:\/\//.test(ah.image || '') && (!p.image_url || !/static\.ah\.nl/.test(p.image_url))) {
      p.image_url = ah.image;
      if (p.id) patchProduct(p.id, { image_url: ah.image }, true);
    }
    if (ah && ah.price != null) {
      parts.push(`<div class="between"><span><strong style="font-weight:600">Albert Heijn nu</strong>${ah.unitSize ? ` · ${esc(ah.unitSize)}` : ''}</span><span style="font-weight:600">${euro(ah.price)}</span></div>`
        + (ah.bonus ? `<span class="chip warn" style="align-self:flex-start">Bonus: ${esc(ah.bonusText || 'in de aanbieding')}${ah.priceBeforeBonus && ah.priceBeforeBonus !== ah.price ? ` (was ${euro(ah.priceBeforeBonus)})` : ''}</span>` : ''));
    }
  }
  try {
    await loadPrices();
    const list = findPrices(p.name, p.full_grams || sizeInBase(p.quantity_text));
    if (list.length) {
      parts.push('<span class="label" style="margin-top:4px">Vergelijkbaar bij andere supermarkten</span>' + list.slice(0, 5).map((it) =>
        `<div class="between" style="font-size:14px;gap:8px"><span style="min-width:0"><strong style="font-weight:600">${esc(storeName(it.store))}</strong> · ${esc(it.naam)}${it.s ? ` <span class="muted">(${esc(it.s)})</span>` : ''}</span><span style="white-space:nowrap">${euro(it.p)}</span></div>`).join(''));
    }
  } catch (e) { /* prijzen zijn optioneel */ }
  if (!document.getElementById('prices')) return;
  box.innerHTML = parts.length
    ? parts.join('') + `<span class="muted" style="font-size:12px">Prijzen: Albert Heijn (live) en Checkjebon.nl (open data${cjbDate ? ', opgehaald ' + cjbDate.toLocaleDateString('nl-NL') : ''}). Andere supermarkten tonen een vergelijkbaar product, niet altijd precies hetzelfde.</span>`
    : '<span class="muted">Geen prijzen gevonden.</span>';
}

// ---------- NEVO (RIVM) ----------
let NEVO = null, nevoPromise = null;
const norm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ');
function loadNevo() {
  if (!nevoPromise) {
    nevoPromise = fetch('nevo.json').then((r) => r.json()).then((d) => {
      NEVO = d.items.map((it) => ({ code: it[0], naam: it[1], syn: it[2], groep: it[3], per: it[4], v: it.slice(5), n: norm(it[1]), k: norm(it[1] + ' ' + it[2] + ' ' + it[3]) }));
      return NEVO;
    });
    nevoPromise.catch(() => { nevoPromise = null; });
  }
  return nevoPromise;
}
const nevoName = (code) => { const it = NEVO && NEVO.find((x) => x.code === code); return it ? it.naam : `NEVO-code ${code}`; };
function wordVariants(w) {
  const v = [w];
  if (w === 'eieren' || w === 'eitje' || w === 'eitjes') v.push('ei');
  if (w === 'uien') v.push('ui');
  if (w.endsWith('en') && w.length > 4) v.push(w.slice(0, -2));
  if (w.endsWith('s') && w.length > 3) v.push(w.slice(0, -1));
  return v;
}
function nevoSearch(q, max = 8) {
  if (!NEVO) return [];
  const words = norm(q).split(/\s+/).filter((w) => w.length >= 2 && !['ah', 'de', 'het', 'een', 'met'].includes(w));
  if (!words.length) return [];
  const pats = words.map((w) => wordVariants(w).map((x) => ({ x, exact: new RegExp('\\b' + x + '\\b'), pre: new RegExp('\\b' + x) })));
  const out = [];
  for (const it of NEVO) {
    if (!it.w) it.w = it.n.split(' ').filter((t) => t.length >= 4);
    let score = 0, hits = 0;
    for (const vs of pats) {
      let best = 0;
      for (const { x, exact, pre } of vs) {
        if (exact.test(it.n)) best = Math.max(best, 4);
        else if (pre.test(it.n)) best = Math.max(best, 2.5);
        else if (it.k.includes(x)) best = Math.max(best, 1);
        else if (x.length >= 6 && it.w.some((t) => x.includes(t))) best = Math.max(best, 1.5);
      }
      if (best) { score += best; hits++; } else score -= 1;
    }
    if (!hits) continue;
    if (wordVariants(words[0]).some((x) => it.n.startsWith(x))) score += 1;
    if (/\brauw\b|\bonbereid\b/.test(it.n)) score += 1;
    score -= it.n.split(' ').length * 0.3;
    out.push({ it, score, all: hits === words.length });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, max);
}
function nevoToNutrition(it) {
  const [kcal, eiwit, vet, verzadigd, koolhydraten, suikers, vezels, natrium] = it.v;
  return { kcal, vet, verzadigd, koolhydraten, suikers, vezels, eiwit, natrium, per: it.per };
}
function linkNevo(p, it) { p.nutrition = nevoToNutrition(it); p.nutrition_source = 'nevo'; p.nevo_code = it.code; }
async function autoNevo(p) {
  if ((p.nutrition && p.nutrition_source !== 'nevo') || p.nevoTouched || !p.name) return false;
  try { await loadNevo(); } catch (e) { return false; }
  const best = nevoSearch(p.name, 1)[0];
  if (best && best.all) { linkNevo(p, best.it); return true; }
  return false;
}
function nevoResultsHtml(q) {
  const res = nevoSearch(q);
  if (!q || norm(q).trim().length < 2) return '<p class="muted">Typ minstens 2 letters.</p>';
  if (!res.length) return '<p class="muted">Niets gevonden in NEVO.</p>';
  return res.map(({ it }) => `<button type="button" class="small-btn" style="text-align:left;justify-content:flex-start;width:100%;white-space:normal;padding:8px 12px" data-action="nevo-pick" data-value="${it.code}"><span style="display:block;font-weight:500">${esc(it.naam)}</span><span class="muted" style="font-size:12px">${esc(it.groep)} · ${it.v[0] ?? '?'} kcal per 100 ${it.per}</span></button>`).join('');
}
function nevoSection(p) {
  if (p.nutrition && p.nutrition_source === 'off') return '';
  const linked = p.nutrition_source === 'nevo'
    ? `<div class="between card" style="padding:8px 8px 8px 14px"><span style="font-size:14px">${esc(nevoName(p.nevo_code))}</span><button type="button" class="small-btn" data-action="nevo-open">Wijzigen</button></div><span class="muted" style="font-size:12px">Bron: ${NEVO_REF}</span>`
    : '';
  const search = state.nevoOpen
    ? `<input class="input" id="nevo-q" autocomplete="off" placeholder="Zoek, bijvoorbeeld: paprika rood" aria-label="Zoeken in NEVO" value="${esc(p.name || '')}">
       <div id="nevo-results" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto">${nevoResultsHtml(p.name || '')}</div>
       ${p.nutrition_source === 'nevo' ? '<button type="button" class="small-btn" data-action="nevo-clear">Koppeling weghalen</button>' : ''}`
    : (!linked ? '<button type="button" class="small-btn" data-action="nevo-open">Voedingswaarde zoeken in NEVO</button>' : '');
  return `<div class="field"><span class="label">Voedingswaarde</span>${linked}${search}</div>`;
}

function viewAbout() {
  return `<main class="wrap">
    ${back('Voorraad')}

// ---------- barcode scannen ----------
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
let scanStream = null, scanning = false, detectorPromise = null;
const setStatus = (msg) => { const el = document.getElementById('scan-status'); if (el) el.textContent = msg; };

function getDetector() {
  if (!detectorPromise) {
    detectorPromise = (async () => {
      if ('BarcodeDetector' in window) {
        try {
          const sup = await window.BarcodeDetector.getSupportedFormats();
          if (FORMATS.some((f) => sup.includes(f))) return new window.BarcodeDetector({ formats: FORMATS });
        } catch (e) { /* val terug op de polyfill */ }
      }
      const mod = await import('https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js');
      return new mod.BarcodeDetector({ formats: FORMATS });
    })();
    detectorPromise.catch(() => { detectorPromise = null; });
  }
  return detectorPromise;
}

async function startScan() {
  state.screen = 'scan'; state.handling = false; state.recent = []; render(); window.scrollTo(0, 0);
  setStatus('Camera starten…');
  try {
    const [detector, stream] = await Promise.all([
      getDetector(),
      navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
    ]);
    if (state.screen !== 'scan') { stream.getTracks().forEach((t) => t.stop()); return; }
    scanStream = stream;
    const video = document.getElementById('scan-video');
    video.srcObject = stream;
    await video.play();
    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) { /* niet elke camera ondersteunt dit */ }
    setStatus('Houd de barcode in het kader, op 10 tot 20 cm afstand.');
    scanning = true;
    const tick = async () => {
      if (!scanning) return;
      if (video.readyState >= 2) {
        try {
          const codes = await detector.detect(video);
          const hit = codes.find((c) => c.rawValue && /^\d{6,14}$/.test(c.rawValue));
          if (hit) { if (navigator.vibrate) navigator.vibrate(60); const cont = await onDetected(hit.rawValue); if (cont && scanning) setTimeout(tick, 1200); return; }
        } catch (e) { /* volgend beeld proberen */ }
      }
      setTimeout(tick, 120);
    };
    tick();
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setStatus(denied
      ? 'Schappie mag de camera niet gebruiken. Geef toestemming in je instellingen, of typ de barcode hieronder in.'
      : 'De scanner kon niet starten. Typ de barcode hieronder in.');
  }
}
async function stopScan() {
  scanning = false;
  if (scanStream) { scanStream.getTracks().forEach((t) => t.stop()); scanStream = null; }
}

const findRule = (text) => RULES.find((r) => r.re.test(String(text || '').toLowerCase())) || null;
function guessOpenDays(text) { const r = findRule(text); return r ? r.open : null; }

// Leest bijvoorbeeld "4 x 150 g" of "10 stuks" uit de inhoud
function parseQuantity(prod) {
  const q = String(prod.quantity || '').toLowerCase().replace(',', '.');
  let total = Number(prod.product_quantity) > 0 ? Math.round(Number(prod.product_quantity)) : null;
  if (!total) {
    const t = q.match(/(\d+(?:\.\d+)?)\s*(kg|g|gr|gram|ml|cl|l|liter)\b/);
    if (t) total = Math.round(Number(t[1]) * ({ kg: 1000, l: 1000, liter: 1000, cl: 10 }[t[2]] || 1));
  }
  const unitTxt = `${prod.product_quantity_unit || ''} ${q}`;
  const liquid = /\bml\b|\bcl\b|\bl\b|liter|litre/.test(unitTxt);
  let count = null, per = null;
  let m = q.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(g|gr|gram|ml|cl|l)\b/);
  if (m) { count = Number(m[1]); per = Number(m[2]) * (m[3] === 'cl' ? 10 : m[3] === 'l' ? 1000 : 1); }
  else if ((m = q.match(/^(\d+)\s*(stuks|st\b|stuk|eieren|eggs|pieces|zakjes|blikjes|blikken)?\s*$/)) || (m = q.match(/(\d+)\s*(stuks|stuk|eieren|eggs|pieces|zakjes)/))) { count = Number(m[1]); }
  return { total, liquid, count, per: per ? Math.round(per) : null };
}

function applyRules(p, text, qty) {
  const r = findRule(text) || {};
  if (r.place) p.place = r.place; else if (!p.place) p.place = 'kast';
  p.freezable = r.freeze ?? true;
  p.open_shelf_days = r.open !== undefined ? r.open : (p.place === 'koelkast' ? 4 : null);
  const total = qty.total;
  if (total) { p.full_grams = total; p.grams = total; p.grams_per_unit = qty.per || total; }
  p.track = r.track || (qty.liquid ? 'niveau' : qty.count ? 'aantal' : 'aantal');
  p.level = 'Vol';
  if (p.track === 'aantal') {
    if (r.unit === 'plakken') {
      p.unit = 'plakken'; p.grams_per_unit = r.gpu;
      p.count = total ? Math.max(1, Math.round(total / r.gpu)) : 10;
    } else if (qty.count) {
      p.count = qty.count;
      p.unit = r.unit || 'stuks';
      if (qty.per) p.grams_per_unit = qty.per; else if (total) p.grams_per_unit = Math.max(1, Math.round(total / qty.count)); else if (r.gpu) p.grams_per_unit = r.gpu;
    } else {
      p.count = 1; p.unit = r.unit || 'stuks';
      if (r.gpu && !total) p.grams_per_unit = r.gpu;
    }
  } else if (p.track === 'gram') {
    p.grams = total || 500;
  } else {
    p.unit = 'pakken';
  }
  p._ruleDays = r.days || null;
  p.expires_on = r.days ? addDays(today(), r.days) : null;
  p.expEstimated = !!r.days;
  return r;
}

const MEMORY_FIELDS = ['name', 'place', 'track', 'unit', 'grams_per_unit', 'full_grams', 'open_shelf_days', 'freezable', ...INFO_FIELDS];
function applyMemory(p, mem) {
  MEMORY_FIELDS.forEach((f) => { if (mem[f] !== undefined) p[f] = mem[f]; });
  p.count = mem.count ?? Math.max(1, Math.round((mem.full_grams || 1) / (mem.grams_per_unit || 1)));
  p.grams = mem.grams ?? mem.full_grams ?? 0;
  p.level = 'Vol';
  if (mem.shelf_days) { p.expires_on = addDays(today(), mem.shelf_days); p.expEstimated = true; p._ruleDays = mem.shelf_days; }
}

async function rememberProduct(p, row, isNew) {
  if (!row.barcode || !state.user) return;
  const prev = state.memory[row.barcode] || {};
  const data = { ...prev };
  MEMORY_FIELDS.forEach((f) => { data[f] = row[f] ?? null; });
  if (isNew) { data.count = row.count; data.grams = row.grams; }
  if (row.expires_on && row.place !== 'vriezer') {
    const base = p.created_at ? iso(new Date(p.created_at)) : today();
    const d = Math.round((parseDate(row.expires_on) - parseDate(base)) / 86400000);
    if (d > 0 && d < 1500) data.shelf_days = d;
  }
  state.memory[row.barcode] = data;
  try { await db.from('product_memory').upsert({ user_id: state.user.id, barcode: row.barcode, data }, { onConflict: 'user_id,barcode' }); } catch (e) { /* geheugen is optioneel */ }
}

async function lookupOpenFoodFacts(code) {
  const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_nl,generic_name_nl,brands,quantity,product_quantity,product_quantity_unit,categories,categories_tags,nutriscore_grade,nova_group,ingredients_text,ingredients_text_nl,allergens_tags,image_front_small_url,nutriments`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const j = await res.json();
  return j.status === 1 && j.product ? j.product : null;
}
async function buildFromCode(code) {
  const p = blankProduct();
  p.barcode = code;
  const known = state.products.find((x) => x.barcode === code);
  const mem = state.memory[code] || (known ? Object.fromEntries(MEMORY_FIELDS.map((f) => [f, known[f]])) : null);
  if (mem && mem.name) { applyMemory(p, mem); return { p, source: 'memory' }; }
  let prod = null, failed = false;
  const ahPromise = ahLookup({ gtin: code });
  try { prod = await lookupOpenFoodFacts(code); } catch (e) { failed = true; }
  if (prod && !(prod.product_name_nl || prod.product_name)) {
    const ahp = await ahPromise;
    if (ahp && ahp.title) prod.product_name = ahp.title;
  }
  if (prod) {
    p.name = (prod.product_name_nl || prod.product_name || '').trim().slice(0, 100);
    Object.assign(p, offToInfo(prod));
    if (!p.name && p.brand) p.name = p.brand;
    const text = `${p.name} ${prod.generic_name_nl || ''} ${prod.categories || ''} ${(prod.categories_tags || []).join(' ')}`;
    applyRules(p, text, parseQuantity(prod));
    if (!p.nutrition) await autoNevo(p);
    const ahQuick = await Promise.race([ahPromise, new Promise((r) => setTimeout(() => r(null), 1500))]);
    if (ahQuick && /^https:\/\//.test(ahQuick.image || '')) p.image_url = ahQuick.image;
    return { p, source: 'off' };
  }
  const ah = await ahPromise;
  if (ah && ah.title) {
    p.name = ah.title.slice(0, 100);
    p.brand = ah.brand || null;
    p.quantity_text = ah.unitSize || null;
    p.image_url = /^https:\/\//.test(ah.image || '') ? ah.image : null;
    p.nutriscore = /^[a-e]$/i.test(ah.nutriscore || '') ? ah.nutriscore.toLowerCase() : null;
    p.categories = ah.category || null;
    applyRules(p, `${ah.title} ${ah.category || ''}`, parseQuantity({ quantity: ah.unitSize || '' }));
    await autoNevo(p);
    return { p, source: 'ah' };
  }
  return { p, source: failed ? 'offline' : 'unknown' };
}

let lastCode = '', lastTime = 0;
async function onDetected(raw) {
  const code = String(raw || '').replace(/\D/g, '');
  if (code.length < 6) { setStatus('Dat lijkt geen geldige barcode. Probeer het nog eens.'); return true; }
  if (state.handling) return true;
  if (state.batch && code === lastCode && Date.now() - lastTime < 5000) return true;
  lastCode = code; lastTime = Date.now();
  state.handling = true;
  if (!state.batch) await stopScan();
  setStatus(`Barcode ${code} gelezen, product opzoeken…`);
  const r = await buildFromCode(code);
  state.handling = false;

  if (!r.p.name) {
    const wasBatch = state.batch;
    await stopScan();
    openForm(r.p, r.source === 'offline'
      ? 'Opzoeken lukte niet. Heb je internet? Vul de gegevens zelf in.'
      : 'Dit product kent Schappie nog niet. Vul de naam in; de rest wordt zo veel mogelijk voor je ingevuld en de volgende keer onthouden.', wasBatch);
    return false;
  }

  if (state.batch) {
    const res = await saveProduct(r.p);
    if (res.error) { setStatus('Opslaan mislukt: ' + res.error); return true; }
    state.recent.push(`${r.p.name} · ${PLACES.find((x) => x[0] === r.p.place)[1].toLowerCase()}`);
    const rec = document.getElementById('recent'); if (rec) rec.innerHTML = recentHtml();
    setStatus('Toegevoegd! Scan het volgende product.');
    toast(`${r.p.name} toegevoegd`, 'Ongedaan maken', async () => {
      await db.from('products').delete().eq('id', res.id);
      state.recent.pop();
      const rec2 = document.getElementById('recent'); if (rec2) rec2.innerHTML = recentHtml();
      toast(`${r.p.name} weer verwijderd`);
      loadProducts();
    });
    loadProducts();
    return true;
  }

  state.edit = r.p; state.note = ''; state.error = ''; state.confirmDelete = false;
  state.info = r.source === 'memory' ? 'Dit product had je eerder, dus Schappie gebruikt jouw instellingen van toen.' : r.source === 'ah' ? 'Niet gevonden in Open Food Facts, wel bij Albert Heijn.' : '';
  state.returnToScan = false;
  state.screen = 'confirm'; render(); window.scrollTo(0, 0);
  return false;
}
const handleCode = onDetected;

function openForm(p, info, returnToScan) {
  state.edit = p; state.info = info || ''; state.note = ''; state.error = ''; state.confirmDelete = false;
  state.showOpenDate = false; state.nevoOpen = false; state.returnToScan = !!returnToScan;
  state.screen = 'form'; render(); window.scrollTo(0, 0);
}

function validate(p) {
  if (!(p.name || '').trim()) return 'Geef het product een naam.';
  if (p.opened_on && p.opened_on > today()) return 'De openingsdatum ligt in de toekomst.';
  if (p.track === 'aantal' && (p.count == null || p.count < 0)) return 'Vul een geldig aantal in.';
  if (p.track === 'gram' && (p.grams == null || p.grams < 0)) return 'Vul een geldig gewicht in.';
  return '';
}
function toRow(p) {
  const row = {
    name: p.name.trim().slice(0, 100), place: p.place, track: p.track,
    count: Math.round(p.count ?? 0), unit: (p.unit || 'stuks').trim().slice(0, 30),
    grams: Math.round(p.grams ?? 0), level: p.level,
    grams_per_unit: Math.max(1, Math.round(p.grams_per_unit || 100)),
    full_grams: Math.max(1, Math.round(p.full_grams || 500)),
    expires_on: p.expires_on || null, opened_on: p.opened_on || null,
    open_shelf_days: p.open_shelf_days ? Math.max(1, Math.round(p.open_shelf_days)) : null,
    freezable: !!p.freezable,
    barcode: p.barcode || null
  };
  INFO_FIELDS.forEach((f) => { row[f] = p[f] ?? null; });
  return row;
}
async function saveProduct(p) {
  const err = validate(p);
  if (err) return { error: err };
  const row = toRow(p);
  const res = p.id
    ? await db.from('products').update(row).eq('id', p.id).select('id').single()
    : await db.from('products').insert(row).select('id').single();
  if (res.error) return { error: res.error.message };
  rememberProduct(p, row, !p.id);
  return { id: res.data.id };
}
async function finishSave(p) {
  state.busy = true; state.error = ''; render();
  const res = await saveProduct(p);
  state.busy = false;
  if (res.error) { state.error = res.error.startsWith('Geef') || res.error.startsWith('De ') || res.error.startsWith('Vul') ? res.error : 'Opslaan mislukt: ' + res.error; render(); return; }
  toast(p.id ? 'Opgeslagen' : `${p.name.trim()} toegevoegd`);
  const back2scan = state.returnToScan;
  state.tab = p.place; state.edit = null; state.info = ''; state.note = ''; state.returnToScan = false;
  if (back2scan) { startScan(); loadProducts(); return; }
  state.screen = 'voorraad';
  await loadProducts();
}

// ---------- interactie ----------
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id, v = el.dataset.value;
  const p = id ? state.products.find((x) => x.id === id) : null;

  switch (a) {
    case 'tab': state.tab = v; render(); break;
    case 'dec': case 'inc': {
      const dir = a === 'inc' ? 1 : -1;
      if (p.track === 'gram') patchProduct(id, { grams: Math.max(0, p.grams + dir * 50) });
      else patchProduct(id, { count: Math.max(0, p.count + dir) });
      break;
    }
    case 'level': patchProduct(id, { level: v }); break;
    case 'open':
      openForm({ ...p }, '', false); break;
    case 'new':
      openForm(blankProduct(), '', false); break;
    case 'back': state.screen = 'voorraad'; state.edit = null; state.info = ''; state.returnToScan = false; render(); break;
    case 'scan': startScan(); break;
    case 'scan-cancel': await stopScan(); state.screen = 'voorraad'; render(); break;
    case 'logout': await db.auth.signOut(); break;
    case 'f-place': {
      const ed = state.edit;
      ed.placeTouched = true;
      if (ed.id) { const r = movePlace(ed, v); state.edit = { ...r.p, placeTouched: true }; state.note = r.note; render(); break; }
      ed.place = v; state.note = '';
      if (ed.expEstimated || !ed.expires_on) {
        if (v === 'vriezer') {
          if (ed.freezable) { ed.expires_on = addDays(today(), Math.max(90, ed._ruleDays || 0)); ed.expEstimated = true; state.note = 'In de vriezer: ongeveer 3 maanden houdbaar.'; }
          else state.note = 'Dit product kun je beter niet invriezen.';
        } else if (ed._ruleDays) { ed.expires_on = addDays(today(), ed._ruleDays); ed.expEstimated = true; }
      }
      render(); break;
    }
    case 'about': state.screen = 'about'; render(); window.scrollTo(0, 0); break;
    case 'nevo-open': {
      state.nevoOpen = true;
      try { await loadNevo(); } catch (err) { toast('NEVO-gegevens laden mislukt'); state.nevoOpen = false; }
      render();
      const q = document.getElementById('nevo-q'); if (q) q.focus();
      break;
    }
    case 'nevo-pick': {
      const it = NEVO && NEVO.find((x) => x.code === Number(v));
      if (it) { linkNevo(state.edit, it); state.edit.nevoTouched = true; }
      state.nevoOpen = false; render(); break;
    }
    case 'nevo-clear': state.edit.nutrition = null; state.edit.nutrition_source = null; state.edit.nevo_code = null; state.edit.nevoTouched = true; state.nevoOpen = false; render(); break;
    case 'f-open-today': {
      const ed = state.edit; ed.opened_on = today(); state.showOpenDate = false;
      const r = findRule(`${ed.name} ${ed.categories || ''}`);
      if (r && r.openPlace && ed.place !== r.openPlace) { ed.place = r.openPlace; state.note = 'Na openen bewaar je dit in de koelkast (advies Voedingscentrum). Ik heb het verplaatst.'; }
      render(); break;
    }
    case 'f-open-other': state.showOpenDate = true; render(); { const d = document.getElementById('f-opened'); if (d) d.focus(); } break;
    case 'confirm-add': {
      const res0 = validate(state.edit);
      if (res0) { state.error = res0; render(); break; }
      await finishSave(state.edit);
      break;
    }
    case 'confirm-edit': state.screen = 'form'; state.showOpenDate = false; state.nevoOpen = false; render(); window.scrollTo(0, 0); break;
    case 'confirm-cancel': state.screen = 'voorraad'; state.edit = null; state.info = ''; render(); break;
    case 'batch-toggle': state.batch = el.checked; try { localStorage.setItem('schappie-batch', state.batch ? '1' : '0'); } catch (err) { /* niet erg */ } setStatus(state.batch ? 'Uitpak-modus aan: elk product wordt meteen toegevoegd.' : 'Uitpak-modus uit: je krijgt eerst een controle.'); break;
    case 'f-track': if (state.edit.track !== v) { state.edit = { ...convert(state.edit, v), trackTouched: true }; render(); } break;
    case 'f-level': state.edit.level = v; render(); break;
    case 'f-unopen': state.edit.opened_on = null; state.showOpenDate = false; render(); break;
    case 'refresh': {
      el.classList.add('spin');
      try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) { /* geen probleem */ }
      location.reload();
      break;
    }
    case 'f-fetchinfo': {
      el.disabled = true; el.textContent = 'Ophalen…';
      try {
        const prod = await lookupOpenFoodFacts(state.edit.barcode);
        if (prod) { Object.assign(state.edit, offToInfo(prod)); state.info = 'Productinformatie opgehaald. Klik op Opslaan om het te bewaren.'; }
        else state.info = 'Dit product staat niet in Open Food Facts.';
      } catch (e) { state.info = 'Ophalen lukte niet. Heb je internet?'; }
      render();
      break;
    }
    case 'delete': {
      if (!state.confirmDelete) { state.confirmDelete = true; render(); break; }
      const { error } = await db.from('products').delete().eq('id', state.edit.id);
      if (error) { toast('Verwijderen mislukt'); break; }
      toast(`${state.edit.name} verwijderd`);
      state.screen = 'voorraad'; state.edit = null;
      await loadProducts();
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'nevo-q') { const box = document.getElementById('nevo-results'); if (box) box.innerHTML = nevoResultsHtml(e.target.value); return; }
  const f = e.target.dataset?.field;
  if (!f || !state.edit) return;
  const t = e.target;
  if (t.type === 'checkbox') state.edit[f] = t.checked;
  else if (t.type === 'number') state.edit[f] = t.value === '' ? null : Number(t.value);
  else if (t.type === 'date') {
    state.edit[f] = t.value || null;
    if (f === 'expires_on') { state.edit.expEstimated = false; state.edit.expTouched = true; }
    if (f === 'opened_on' || f === 'expires_on') render();
  } else state.edit[f] = t.value;
  if (f === 'expires_on') { state.edit.expEstimated = false; state.edit.expTouched = true; }
  if (f === 'open_shelf_days') state.edit.shelfTouched = true;
  if (state.error) { state.error = ''; }
});

document.addEventListener('change', async (e) => {
  if (e.target.id !== 'f-name' || !state.edit || state.edit.id) return;
  const ed = state.edit;
  const linked = await autoNevo(ed);
  const r = findRule(ed.name);
  if (!r) { if (linked) render(); return; }
  if (!ed.placeTouched && r.place) ed.place = r.place;
  if (!ed.trackTouched && r.track) {
    ed.track = r.track;
    if (r.unit) ed.unit = r.unit;
    if (r.gpu) ed.grams_per_unit = r.gpu;
    if (r.unit === 'plakken' && ed.count <= 1) ed.count = 10;
    if (r.track === 'gram' && !ed.grams) ed.grams = 500;
  }
  if (!ed.expTouched && r.days && !ed.barcode) { ed.expires_on = addDays(today(), r.days); ed.expEstimated = true; ed._ruleDays = r.days; }
  if (!ed.shelfTouched) ed.open_shelf_days = r.open ?? null;
  if (r.freeze != null) ed.freezable = r.freeze;
  render();
});
document.addEventListener('toggle', (e) => { if (e.target.id === 'adv') state.advOpen = e.target.open; }, true);

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target.dataset.form;

  if (form === 'code') {
    onDetected(document.getElementById('code').value);
    return;
  }

  if (form === 'login') {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pw').value;
    if (!email || !password) { state.error = 'Vul je e-mailadres en wachtwoord in.'; render(); return; }
    state.busy = true; state.error = ''; render();
    const { error } = await db.auth.signInWithPassword({ email, password });
    state.busy = false;
    if (error) { state.error = 'Inloggen mislukt. Controleer je e-mailadres en wachtwoord.'; render(); }
    return;
  }

  if (form === 'product') {
    const err = validate(state.edit);
    if (err) { state.error = err; render(); if (err.startsWith('Geef')) document.getElementById('f-name').focus(); return; }
    await finishSave(state.edit);
  }
});

// ---------- opstarten ----------
db.auth.onAuthStateChange((_event, session) => {
  const user = session?.user ?? null;
  const changed = (user?.id) !== (state.user?.id);
  state.user = user;
  if (!user) { state.products = []; state.screen = 'login'; render(); return; }
  if (changed || state.screen === 'loading' || state.screen === 'login') {
    state.screen = 'voorraad';
    render();
    setTimeout(loadProducts, 0);
  }
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
